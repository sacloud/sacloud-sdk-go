components:
  schemas:
    AddressListResponse:
      type: object
      required:
        - Total
        - From
        - Count
        - Addresses
      properties:
        Total:
          type: integer
          format: int32
          description: 対象リソースの総件数
        From:
          type: integer
          format: int32
          description: 現在のページ番号
        Count:
          type: integer
          format: int32
          description: 現在のページの件数
        Addresses:
          type: array
          items:
            $ref: '#/components/schemas/ReadAddress'
          description: アドレス一覧
      description: 成功時のレスポンス
    AddressResponse:
      type: object
      required:
        - Address
      properties:
        Address:
          $ref: '#/components/schemas/ReadAddress'
          description: アドレス
      description: 成功時のレスポンス
    ApiError:
      type: object
      properties:
        serial:
          type: string
        error_code:
          type: string
        error_msg:
          type: string
      description: 失敗時のレスポンス
      examples:
        - serial: 4f464bf7db102d5e8e2092876506bc77
          error_code: forbidden
          error_msg: 要求された操作は許可されていません。権限エラー。
    CreateInterfaceConnection:
      type: object
      required:
        - Interface
        - Subnet
      properties:
        EphemeralIPv4Address:
          type: string
          description: IPv4アドレス
        Interface:
          $ref: '#/components/schemas/SakuraResourceNameRef'
          description: サーバーNIC (インターフェース)
        Subnet:
          $ref: '#/components/schemas/SakuraResourceNameRef'
          description: サブネット
    CreateSubnet:
      type: object
      required:
        - Name
        - Description
        - IPv4AddressRangeCIDR
        - Zone
        - SubnetGroup
      properties:
        Name:
          type: string
          description: 名前
        Description:
          type: string
          description: 説明
        IPv4AddressRangeCIDR:
          type: string
          description: |-
            IPv4アドレス範囲 (CIDR形式)

            [マニュアル](https://manual.sakura.ad.jp/cloud/network/networking-suite/index.html)内「仕様」に記載の条件を満たすIPアドレス範囲をCIDR形式で表現します。
            IPv4アドレス範囲は、親サブネットグループのIPv4アドレス範囲に含まれ、かつ、同一親サブネットグループ下の他サブネットと重複しない範囲である必要があります。
        Zone:
          $ref: '#/components/schemas/Zone'
          description: ゾーン
        SubnetGroup:
          $ref: '#/components/schemas/SakuraResourceNameRef'
          description: 親サブネットグループ
    CreateSubnetGroup:
      type: object
      required:
        - Name
        - Description
        - IPv4AddressRangeCIDR
        - Region
      properties:
        Name:
          type: string
          description: 名前
        Description:
          type: string
          description: 説明
        IPv4AddressRangeCIDR:
          type: string
          description: |-
            IPv4アドレス範囲 (CIDR形式)

            [マニュアル](https://manual.sakura.ad.jp/cloud/network/networking-suite/index.html)内「仕様」に記載の条件を満たすIPアドレス範囲をCIDR形式で表現します。
        Region:
          $ref: '#/components/schemas/Region'
          description: リージョン
    CreatedInterfaceConnectionResponse:
      type: object
      required:
        - InterfaceConnection
      properties:
        InterfaceConnection:
          $ref: '#/components/schemas/ReadInterfaceConnection'
          description: インターフェースコネクション
      description: 成功時のレスポンス
    CreatedSubnetGroupResponse:
      type: object
      required:
        - SubnetGroup
      properties:
        SubnetGroup:
          $ref: '#/components/schemas/ReadSubnetGroup'
          description: サブネットグループ
      description: 成功時のレスポンス
    CreatedSubnetResponse:
      type: object
      required:
        - Subnet
      properties:
        Subnet:
          $ref: '#/components/schemas/ReadSubnet'
          description: サブネット
      description: 成功時のレスポンス
    ReadAddress:
      type: object
      required:
        - SRN
        - AddressType
        - IPVersion
        - IPAddress
        - Subnet
      properties:
        SRN:
          type: string
          description: さくらのリソース名 (SRN)
        AddressType:
          type: string
          description: アドレス種別; `EPHEMERAL_ADDRESS` 固定
        IPVersion:
          type: string
          description: アドレスバージョン; `IPv4` 固定
        IPAddress:
          type: string
          description: IPアドレス
        Subnet:
          $ref: '#/components/schemas/SakuraResourceNameRef'
          description: アドレスが属するサブネット
    ReadInterfaceConnection:
      type: object
