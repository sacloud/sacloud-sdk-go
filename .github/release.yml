changelog:
  exclude:
    labels:
      - tagpr
  categories:
    - title: 💥 Breaking Changes
      labels:
        - sacloud-major
    - title: 🚀 New Features
      labels:
        - sacloud-minor
    - title: ✨ Ordinary Updates
      labels:
        - "*"
      exclude:
        labels:
          - dependencies
    - title: 📦 Dependency Updates
      labels:
        - dependencies
