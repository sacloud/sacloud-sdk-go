version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "00:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci:"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directories:
      - /
      - /api/addon
      - /api/apigw
      - /api/cloudhsm
      - /api/eventbus
      - /api/iaas/trace/otel
      - /api/kms
      - /api/monitoring-suite
      - /api/nosql
      - /api/object-storage
      - /api/webaccel
      - /service/iaas
      - /service/webaccel
    schedule:
      interval: daily
      time: "00:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "go:"
    cooldown:
      default-days: 7
